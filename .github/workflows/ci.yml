# M0-SH-05 (D-022) — real CI for the shared packages.
#
# The Eutectic workspace is ONE pnpm workspace spanning three repos; a lone
# clone cannot install (`workspace:*` deps and the lockfile's importers span
# all three). So this job reconstructs the workspace: all three repos checked
# out as siblings, the tracked `workspace-root/` mirror copied up one level,
# then a frozen install. Siblings are pinned to `develop` — shared changes are
# validated against what the domain repos actually run today.
#
# Gates: build (tokens build includes the WCAG contrast gate), typecheck,
# test (includes the artefact byte-sync tests), and generated-file staleness
# (`generated/` must be exactly what `src/` renders).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - name: Check out eutectic-shared (this ref)
        uses: actions/checkout@v4
        with:
          path: eutectic-shared

      - name: Check out eutectic-backend @ develop (workspace sibling)
        uses: actions/checkout@v4
        with:
          repository: Sumit-07/eutectic-backend
          ref: develop
          path: eutectic-backend

      - name: Check out eutectic-frontend @ develop (workspace sibling)
        uses: actions/checkout@v4
        with:
          repository: Sumit-07/eutectic-frontend
          ref: develop
          path: eutectic-frontend

      - name: Synthesize the workspace root from the tracked mirror
        run: |
          cp eutectic-shared/workspace-root/package.json \
             eutectic-shared/workspace-root/pnpm-workspace.yaml \
             eutectic-shared/workspace-root/pnpm-lock.yaml \
             eutectic-shared/workspace-root/tsconfig.base.json \
             eutectic-shared/workspace-root/turbo.json \
             eutectic-shared/workspace-root/.nvmrc \
             .
          touch .synthesized-from-mirror

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen — drift between a repo and the lockfile mirror fails here)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (tokens build runs the contrast gate)
        run: pnpm --filter "./eutectic-shared/packages/*" run build

      - name: Typecheck shared packages
        run: pnpm --filter "./eutectic-shared/packages/*" run typecheck

      - name: Test shared packages (includes artefact byte-sync)
        run: pnpm --filter "./eutectic-shared/packages/*" run test

      - name: Generated files are exactly what src renders
        run: |
          pnpm --filter "@eutectic/contracts" run generate
          git -C eutectic-shared diff --exit-code -- \
            packages/contracts/generated packages/tokens/generated
