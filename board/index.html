<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eutectic — Board</title>
<!--
  FABLE: this is the board. You are the only writer.
  Edit the TICKETS array at the bottom of this file. Nothing else.
  Move a card by changing its `state`. Record the date it entered that state
  in `since` (YYYY-MM-DD) so age-in-state is accurate.
  States: todo | doing | review | validation | done | blocked | decision
  Lanes:  frontend | backend | shared | infra
-->
<style>
  :root{
    --paper:#FCFCFA; --paper-sink:#F4F4F1; --paper-raise:#FFF;
    --rule:#E4E4DF; --rule-soft:#EFEFEA; --rule-strong:#CECEC7;
    --ink:#16171A; --ink-soft:#4A4C52; --ink-quiet:#6F7178; --ink-faint:#9B9DA4;
    --positive:#2F6E38; --negative:#A2374C; --caution:#8A5A12; --focus:#33489E;
    --lane-frontend:#6B3FA0; --lane-backend:#17697E;
    --lane-shared:#A9660F;   --lane-infra:#3F7A34;
    --sans:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;
    --serif:Newsreader,Georgia,serif;
    --mono:'Commit Mono',ui-monospace,'IBM Plex Mono',monospace;
  }
  [data-theme="dark"]{
    --paper:#0F0F11; --paper-sink:#141417; --paper-raise:#17171A;
    --rule:#232327; --rule-soft:#1C1C20; --rule-strong:#33333A;
    --ink:#EDEAE3; --ink-soft:#C3C1BB; --ink-quiet:#83838D; --ink-faint:#5A5A63;
    --positive:#6FA85F; --negative:#CE7D8E; --caution:#D9A34E; --focus:#8296D6;
    --lane-frontend:#B48CD6; --lane-backend:#5FB2C6;
    --lane-shared:#E4A159;   --lane-infra:#8CC183;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:baseline;gap:16px;padding:20px 24px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:5;flex-wrap:wrap}
  h1{margin:0;font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:-.2px}
  .milestone{font-family:var(--mono);font-size:11px;color:var(--ink-quiet);border:1px solid var(--rule);padding:1px 7px}
  .counts{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .counts b{color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:8px;align-items:center}
  button,select{font-family:inherit;font-size:12px;background:none;border:1px solid var(--rule);color:var(--ink-soft);padding:3px 9px;border-radius:2px;cursor:pointer}
  button:hover,select:hover{border-color:var(--ink-faint);color:var(--ink)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:0;overflow-x:auto}
  .col{border-right:1px solid var(--rule);min-height:70vh}
  .col:last-child{border-right:0}
  .colhead{position:sticky;top:10px;background:var(--paper);padding:10px 12px;border-bottom:5px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:8px;z-index:4}
  .colname{font-size:12px;font-weight:600}
  .coln{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .col[data-state="decision"] .colname{color:var(--negative)}
  .col[data-state="blocked"] .colname{color:var(--caution)}
  .stack{padding:8px}

  .card{border:1px solid var(--rule);border-left-width:2px;background:var(--paper-raise);padding:9px 10px;margin-bottom:7px;border-radius:2px}
  .card:hover{border-color:var(--rule-strong)}
  .card[data-lane="frontend"]{border-left-color:var(--lane-frontend)}
  .card[data-lane="backend"]{border-left-color:var(--lane-backend)}
  .card[data-lane="shared"]{border-left-color:var(--lane-shared)}
  .card[data-lane="infra"]{border-left-color:var(--lane-infra)}
  .cid{font-family:var(--mono);font-size:10px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:6px}
  .age{font-variant-numeric:tabular-nums}
  .age.warn{color:var(--caution)}
  .age.bad{color:var(--negative);font-weight:600}
  .ctitle{margin:3px 0 6px;font-size:12.5px;line-height:1.35}
  .cmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .tag{font-family:var(--mono);font-size:9.5px;color:var(--ink-quiet);border:1px solid var(--rule);padding:0 5px;border-radius:2px}
  .tag.spec{color:var(--ink-faint)}
  .tag.shared{color:var(--lane-shared);border-color:var(--lane-shared)}
  .tag.risk{color:var(--negative);border-color:var(--negative)}
  .tag.owner{color:var(--ink-soft)}
  .empty{color:var(--ink-faint);font-size:11.5px;padding:12px;font-family:var(--serif);font-style:italic}
  footer{padding:14px 24px;border-top:1px solid var(--rule);color:var(--ink-faint);font-size:11px}
  @media (max-width:900px){ .board{grid-template-columns:repeat(7,minmax(180px,1fr))} }
</style>
</head>
<body>

<header>
  <h1>Eutectic</h1>
  <span class="milestone" id="ms">M0 — Foundations</span>
  <div class="controls">
    <select id="lane" aria-label="Filter by lane">
      <option value="">All lanes</option>
      <option value="frontend">Frontend</option>
      <option value="backend">Backend</option>
      <option value="shared">Shared</option>
      <option value="infra">Infra</option>
    </select>
    <button id="theme" aria-label="Toggle theme">Theme</button>
  </div>
  <div class="counts" id="counts"></div>
</header>

<main class="board" id="board"></main>

<footer>
  Cards move left to right. <strong>Blocked</strong> and <strong>Needs your call</strong> are
  surfaced weekly. Anything over 3 days in either is escalated.
</footer>

/* ───────────────────────────────────────────────────────────── */

const daysSince = d => Math.max(0, Math.floor((Date.now() - new Date(d)) / 864e5));

function render() {
  const laneFilter = document.getElementById('lane').value;
  const shown = TICKETS.filter(t => !laneFilter || t.lane === laneFilter);
  const board = document.getElementById('board');
  board.innerHTML = '';

  for (const [state, label] of STATES) {
    const items = shown.filter(t => t.state === state);
    const col = document.createElement('section');
    col.className = 'col';
    col.dataset.state = state;
    col.innerHTML =
      '<div class="colhead"><span class="colname">' + label +
      '</span><span class="coln">' + items.length + '</span></div>' +
      '<div class="stack">' + (items.length
        ? items.map(card).join('')
        : '<p class="empty">Nothing here.</p>') + '</div>';
    board.appendChild(col);
  }

  const c = s => TICKETS.filter(t => t.state === s).length;
  document.getElementById('counts').innerHTML =
    '<span>open <b>' + (TICKETS.length - c('done')) + '</b></span>' +
    '<span>done <b>' + c('done') + '</b></span>' +
    '<span>blocked <b>' + (c('blocked') + c('decision')) + '</b></span>';
  document.getElementById('ms').textContent = MILESTONE;
}

function card(t) {
  const age = daysSince(t.since);
  const stale = ['blocked','decision','validation'].includes(t.state);
  const cls = stale && age >= 3 ? 'bad' : (age >= 3 ? 'warn' : '');
  return '<article class="card" data-lane="' + t.lane + '">' +
    '<div class="cid"><span>' + t.id + '</span>' +
      '<span class="age ' + cls + '">' + age + 'd</span></div>' +
    '<p class="ctitle">' + t.title + '</p>' +
    '<div class="cmeta">' +
      (t.spec   ? '<span class="tag spec">' + t.spec + '</span>' : '') +
      (t.owner  ? '<span class="tag owner">' + t.owner + '</span>' : '') +
      (t.shared ? '<span class="tag shared">shared</span>' : '') +
      (t.risk   ? '<span class="tag risk">risk</span>' : '') +
    '</div></article>';
}

document.getElementById('lane').addEventListener('change', render);
document.getElementById('theme').addEventListener('click', () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
});
render();
