      required: true
      schema:
        $ref: '#/components/schemas/Slug'
    SettingKey:
      name: key
      in: path
      required: true
      description: Dotted setting key, e.g. `routing.coverage_target`. Seeded, never created via the API.
      schema:
        $ref: '#/components/schemas/SettingKeyName'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

